name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: main

permissions:
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 DockterWiki 开始部署

            🔗 访问地址: https://shenxianmq-dockter.github.io/
            📅 部署时间: ${{ github.event.head_commit.timestamp }}
            📝 提交信息: ${{ github.event.head_commit.message }}
            👤 提交者: ${{ github.event.head_commit.author.name }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Prepare Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Generate site
        run: pnpm docs:build
      - name: Deploy to server
        id: server_copy
        # 服务器为额外副本；认证失败时仍应发布 Pages 主站。
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./.vitepress/dist/*"
          target: ${{ secrets.SSH_TARGET_PATH }}
      - name: Report server mirror failure
        if: steps.server_copy.outcome == 'failure'
        run: echo "::warning::服务器副本 SSH 部署失败，请检查 SSH 凭据；继续发布 GitHub Pages 主站。"
      - name: Upload Pages artifacts
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🎉 DockterWiki 部署成功！

            🔗 访问地址: https://dockter.symedia.top/
            📅 部署时间: ${{ github.event.head_commit.timestamp }}
            📝 提交信息: ${{ github.event.head_commit.message }}
            👤 提交者: ${{ github.event.head_commit.author.name }}
